[project]
name = "meow-meow-hood"
version = "0.2.3"
description = "A robinhood api wrapper for option data"
readme = "README.pypi.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.13.5",
  "python-dotenv>=1.2.2",
  "python-snappy>=0.7.3",
  "requests>=2.33.1",
  "tzdata>=2026.2",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Trent Lee" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/DaBestXD/meow-meow-hood"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-platform = "all"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robinhood*"]
namespaces = false

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "strict"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "build>=1.3.0",
  "pyright>=1.1.407",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.10",
  "ty>=0.0.64",
  "types-requests>=2.33.0.20260712",
]
